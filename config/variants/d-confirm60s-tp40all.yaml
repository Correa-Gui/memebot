# Variante de pesquisa offline (Fase 4, replay) — hipótese (d), derivada de config/strategy.v0.yaml (v0.1):
# entrada = a melhor de (a)-(c) pelo PnL líquido no período de AJUSTE do pnpm replay:sweep (relógio paper_wall,
# aquecimento 2 h, corte 07:14 UTC) de 2026-10-02: a-confirm-60s (+0,0469 SOL; a validação NÃO entrou na escolha)
# + saída "vender tudo em +40%" (sem TP2/trailing), mantendo stop -20% e time stop 10 min. Tudo o mais = v0.1.
version: v0.1-exp-d-confirm60s-tp40all              # experimento de 2026-10-02 (docs/STRATEGY.md §8) — NÃO é a config do paper

entry:
  minAgeSec: 60
  maxAgeSec: 600
  minBuySellVolumeRatio60s: 1.5
  minUniqueBuyers60s: 15
  requirePriceAboveMean120s: true
  maxSingleSellPctSupply60s: 0.03
  confirmation: { windowSec: 60, maxDipPct: 0.10 }

filters:
  allowedVenues: [curve]      # PumpSwap fica fora até o swap exato bater (docs/ROADMAP.md Fase 2)
  allowedQuoteMints: ["11111111111111111111111111111111", "So11111111111111111111111111111111111111112"]
  maxTop10PctSupply: 0.30
  maxSameSlotAsCreatePct: 0.10
  maxCreatorHoldingPct: 0.05
  maxCreatorTokens24h: 3
  minUniqueHolders: 40
  minVolume60sSol: 5
  maxRiskScore: 0.30          # ignorado enquanto o modelo não existir

sizing:
  sizeSol: 0.05               # = hard limit maxPositionLamports (vale também no paper; config só reduz)
  maxOwnPriceImpactPct: 0.02

exits:
  takeProfit:
    - { gainPct: 0.40, sellFraction: 1.00 }   # (d) vende tudo em +40%; trailing nunca chega a valer
  trailingStopPct: 0.25
  stopLossPct: 0.20
  timeStopSec: 600
  emergency:
    singleSellPctSupply: 0.05
    exitOnCreatorSell: true

signals:
  riskModel: { enabled: false, path: packages/signals/models/risk.onnx }
  narrative: { enabled: false, minMatch: 0.7 }
  smartMoney: { enabled: false, minWallets: 2 }

risk:
  maxOpenPositions: 3
  maxDailyLossSol: 0.2
